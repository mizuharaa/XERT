name: Optional integrations

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lerobot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      MUJOCO_GL: osmesa
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-act-linux-lock.txt
      - name: Install codec runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg libosmesa6
      - name: Install isolated dataset dependencies
        run: |
          python -m venv .venv-lerobot
          .venv-lerobot/bin/python -m pip install -r requirements-act-linux-lock.txt
          .venv-lerobot/bin/python -m pip check
      - name: Build native core for the isolated Python
        run: |
          cmake -S . -B build/lerobot -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE="$PWD/.venv-lerobot/bin/python"
          cmake --build build/lerobot --parallel 2
          ctest --test-dir build/lerobot -C Release --output-on-failure
      - name: Require the real LeRobot reader and ACT policy
        run: |
          .venv-lerobot/bin/python -c "from importlib.metadata import version; from lerobot.datasets.lerobot_dataset import LeRobotDataset; from lerobot.policies.act.modeling_act import ACTPolicy; assert version('lerobot') == '0.6.1'"
          .venv-lerobot/bin/python -m pytest -q tests/test_lerobot_export.py tests/test_lerobot_act.py tests/test_recorder.py tests/test_quality.py tests/test_teleop.py tests/test_gate_experiment.py
  teleop:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      MUJOCO_GL: osmesa
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-teleop-linux-lock.txt
      - name: Install codec and headless runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg libosmesa6 libegl1 libgl1 libgles2 libportaudio2
      - name: Install combined LeRobot + MediaPipe dependencies
        run: |
          python -m venv .venv-teleop
          .venv-teleop/bin/python -m pip install --no-deps -r requirements-teleop-linux-lock.txt
          # The lock excludes opencv-contrib-python on purpose; that must be the only unmet requirement.
          test "$(.venv-teleop/bin/python -m pip check || true)" = "mediapipe 0.10.35 requires opencv-contrib-python, which is not installed."
      - name: Build native core for the combined Python
        run: |
          cmake -S . -B build/teleop -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE="$PWD/.venv-teleop/bin/python"
          cmake --build build/teleop --parallel 2
      - name: Verify real hand model and the dataset/vision/teleop tests in one Python
        run: |
          .venv-teleop/bin/python -m scripts.fetch_hand_model
          .venv-teleop/bin/python -m scripts.smoke_hand_model
          .venv-teleop/bin/python -m pytest -q tests/test_lerobot_export.py tests/test_lerobot_act.py tests/test_recorder.py tests/test_quality.py tests/test_teleop.py tests/test_gate_experiment.py tests/test_motion_file.py tests/test_retarget_quality.py tests/test_webcam.py tests/test_runtime.py tests/test_safety.py tests/test_calibration_cli.py
  webcam:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-webcam-lock.txt
      - name: Install headless runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libgl1 libgles2 libportaudio2
      - name: Install isolated vision dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/python -m pip install -r requirements-lock.txt -r requirements-webcam-lock.txt
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
          .venv/bin/python -m pip check
      - name: Build native core
        run: bash scripts/build_core.sh
      - name: Verify real hand model without a camera
        run: |
          .venv/bin/python -m scripts.fetch_hand_model
          .venv/bin/python -m scripts.smoke_hand_model
      - name: Check mocked capture, mapping, runtime, and safety
        run: .venv/bin/python -m pytest -q tests/test_runtime.py tests/test_safety.py tests/test_webcam.py tests/test_calibration_cli.py
