name: ROS 2 Jazzy package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xert_ros:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: ros:jazzy
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install build, test and exec dependencies
        # The bridge launch test runs nodes, so exec deps (robot_state_publisher,
        # launch_ros, rclpy) are installed too; rviz2 is skipped, it pulls in Qt
        # and Ogre and the test runs headless.
        run: |
          apt-get update
          rosdep update --rosdistro jazzy
          rosdep install --from-paths ros --ignore-src -y --rosdistro jazzy \
            -t buildtool -t build -t build_export -t test -t exec --skip-keys rviz2
      - name: XERT runtime in the Jazzy system Python (rclpy lives there, so no venv)
        env:
          PIP_BREAK_SYSTEM_PACKAGES: '1'
        run: |
          apt-get install -y --no-install-recommends python3-pip python3-dev
          # --ignore-installed: never uninstall apt-owned copies (numpy is the same 1.26.4).
          python3 -m pip install --no-deps --ignore-installed -r requirements-bridge-linux-lock.txt
          # CMakeLists.txt runs this interpreter with -m pybind11 --cmakedir; fail here, not in CMake.
          python3 -c "import numpy, mujoco, pybind11"
      - name: Native core against /usr/bin/python3, then XERT itself
        env:
          PIP_BREAK_SYSTEM_PACKAGES: '1'
        run: |
          cmake -S . -B build/ros -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE=/usr/bin/python3
          cmake --build build/ros --target _reach_core --parallel 2
          python3 -m pip install --no-deps -e .
          # CalibratedMapper imports the native xle_workbench._reach_core: gate before any launch test.
          python3 -c "from xert.retarget.calibrate import CalibratedMapper"
      - name: Build
        working-directory: ros
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select xert_ros xert_ros_bridge --event-handlers console_direct+
      - name: Test (xert_ros linters + gtest, bridge launch test)
        working-directory: ros
        env:
          # ament_cppcheck skips cppcheck 2.x (Ubuntu 24.04 ships 2.x) as too slow
          # unless this is set; three source files are fast enough.
          AMENT_CPPCHECK_ALLOW_SLOW_VERSIONS: '1'
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --packages-select xert_ros xert_ros_bridge --event-handlers console_direct+
          colcon test-result --verbose
      - name: Bridge unit tests with rclpy present
        run: |
          source /opt/ros/jazzy/setup.bash
          source ros/install/setup.bash
          python3 -m pytest -q tests/test_ros_bridge.py
