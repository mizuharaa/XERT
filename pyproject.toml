[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xlerobot-workbench"
version = "0.1.0"
description = "Local XLeRobot simulation, demonstrations, imitation learning, and reproducible evaluation"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26", "mujoco>=3.3", "pillow>=10", "fastapi>=0.115", "uvicorn>=0.30", "torch>=2.5"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
xle = "xle_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["xle_workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

